name = "onevoice-narration-api"
main = "src/worker.mjs"
compatibility_date = "2026-11-06"
workers_dev = true
keep_vars = true

[vars]
# Public mode explicitly requested by repository owner. IMPORTANT:
# Github Actions inputs, job logs, and generated MP3 artifacts are accessible
# to people with read access to this public repository. Do not send private text.
GITHUB_OWNER = "criticalcareresearchny-debug"
GITHUB_REPO = "one-voice-narrator"
ALLOW_PUBLIC_PROCESSOR = "true"

# Never store ONEVOICE_API_KEY or GITHUB_API_TOKEN here.
# If deploying the optional Worker, set them as encrypted Worker secrets.
