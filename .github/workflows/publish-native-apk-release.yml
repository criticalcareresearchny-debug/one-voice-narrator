name: Publish One Voice Native beta APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-native-apk-release.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retrieve verified API Connect APK build
        uses: actions/download-artifact@v4
        with:
          name: OneVoice-Native-Android-APK
          run-id: 42331461891
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets
      - name: Verify and name the APK
        run: |
          test -s release-assets/app-debug.apk
          SIZE=$(wc -c < release-assets/app-debug.apk)
          echo "APK size: ${SIZE} bytes"
          test "$SIZE" -gt 150000000
          mv release-assets/app-debug.apk release-assets/OneVoice-Native-Readable-Voices-API-Connect.apk
          sha256sum release-assets/OneVoice-Native-API-Connect.apk
      - name: Create direct APK download on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="onevoice-native-api-connect-v0.1.1-beta2"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/OneVoice-Native-API-Connect.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/OneVoice-Native-API-Connect.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "One Voice Native — Readable Voices + API Connect beta 0.1.1" \
              --notes "Updated beta with WHITE high-contrast English narrator names and mint dropdown arrow, plus all six Kokoro voices, 0.70–1.50x speed, local MP3, Android foreground processing, Share target and user-confirmed Android API Connect. The native APK is debug-signed on GitHub; its signature may differ from the earlier beta. If Android refuses an update, copy your unsaved script somewhere safe, uninstall only the earlier One Voice Native app, then install this version. MP3s in Downloads / One Voice remain. Keep the separate PWA for now. Actual audio production and API callbacks on-device remain beta tests."
          fi
