name: Publish One Voice Native beta APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-native-apk-release.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retrieve verified API Connect APK build
        uses: actions/download-artifact@v4
        with:
          name: OneVoice-Native-Android-APK
          run-id: 42333545099
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets
      - name: Verify and name the APK
        run: |
          test -s release-assets/app-debug.apk
          SIZE=$(wc -c < release-assets/app-debug.apk)
          echo "APK size: ${SIZE} bytes"
          test "$SIZE" -gt 150000000
          mv release-assets/app-debug.apk release-assets/OneVoice-Native-API-Token-Connect.apk
          sha256sum release-assets/OneVoice-Native-API-Token-Connect.apk
      - name: Create direct APK download on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="onevoice-native-api-connect-v0.1.2-beta3"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/OneVoice-Native-API-Token-Connect.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/OneVoice-Native-API-Token-Connect.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "One Voice Native — API Token Connect beta 0.1.2" \
              --notes "Version 0.1.2 beta adds API CONNECT CLOUD NARRATION controls in the APK: Generate API Token on GitHub opens a prefilled GitHub fine-grained PAT form; Copy API Address; Manage or Revoke Tokens. Requires selecting only one-voice-narrator and Actions write in GitHub. The APK does not generate, store, or read a GitHub PAT. Existing high-contrast narrator dropdown, six voices, speed controls, MP3 export, and Android background service remain. Beta/debug signed: if Android says not installed due to signature mismatch, back up scripts, uninstall prior One Voice Native then install this version. Recordings under Downloads remain. Narration and tokens are for owner-approved PUBLIC GitHub workflow; submitted text and output can be public."
          fi
