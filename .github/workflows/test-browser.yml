name: Test narration in a real browser
on:
  push:
    branches: [main]
    paths:
      - 'test/tts-smoke.mjs'
      - '.github/workflows/test-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for smoke test
        run: |
          npm install --no-save --no-package-lock --no-fund --no-audit playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test voice sample and MP3 download
        run: |
          python3 -m http.server 8088 --bind 127.0.0.1 >/tmp/onevoice-http.log 2>&1 &
          sleep 2
          node test/tts-smoke.mjs
