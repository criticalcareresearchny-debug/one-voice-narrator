name: Test One Voice token API
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/test-token-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify token-authenticated API and safe GitHub dispatch
        working-directory: api
        run: npm test
